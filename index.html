    <div class="flex justify-center item-center min-h-screen bg-gray-800 gap-2">
        <!-- lampu 1 -->
        <div class="flex flex-col gap-2  items-center">

            <label for="default-toggle1" class="inline-flex relative items-center
          cursor-pointer">

            peer" onchange="saklar()">
